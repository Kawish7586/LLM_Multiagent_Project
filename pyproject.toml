[project]
name = "llm-multiagent-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "readability-lxml>=0.9",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
]

[project.scripts]
llm-multiagent-project = "llm_multiagent_project:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
